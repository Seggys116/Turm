version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
    labels:
      - ci

  # No swift entry: Dependabot reads Package.swift, and SwiftTerm lives in Turm.xcodeproj.
