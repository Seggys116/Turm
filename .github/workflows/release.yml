name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, notarise and publish
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    env:
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi

      - name: Resolve the version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not a version tag such as v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "dmg=Turm-$VERSION-arm64.dmg"
            case "$VERSION" in
              *-*) echo "prerelease=true" ;;
              *)   echo "prerelease=false" ;;
            esac
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Swift package checkouts
        id: swiftpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Turm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Turm.xcodeproj \
            -scheme Turm \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -only-testing:TurmTests \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Import the signing certificate
        id: keychain
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/turm-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          echo "ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '" ' | tr '\n' ' ')" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          /bin/rm -f "$CERT_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" |
            awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate."
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing as $IDENTITY"

          {
            echo "keychain=$KEYCHAIN"
            echo "identity=$IDENTITY"
          } >> "$GITHUB_OUTPUT"

      - name: Install the provisioning profile
        id: profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$PROVISIONING_PROFILE" ]; then
            echo "::error::MACOS_PROVISIONING_PROFILE is not set. Turm's keychain sharing and iCloud entitlements need a Developer ID provisioning profile."
            exit 1
          fi
          PROFILE_PATH="$RUNNER_TEMP/turm.provisionprofile"
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$UUID.provisionprofile"
          done
          /bin/rm -f "$PROFILE_PATH" "$PLIST"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Install the notary key
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Archive
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ steps.profile.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Turm.xcodeproj \
            -scheme Turm \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Turm.xcarchive" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            TURM_APP_PROFILE="$PROFILE" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN"

      - name: Save the Swift package checkouts
        if: always() && steps.swiftpm.outputs.cache-hit != 'true' && hashFiles('DerivedData/SourcePackages/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}

      - name: The archive carries the update feed and key
        run: |
          PLIST="$RUNNER_TEMP/Turm.xcarchive/Products/Applications/Turm.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$PLIST")" = "https://seggys116.github.io/Turm/appcast.xml"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$PLIST")"

      - name: Sign the Sparkle helpers
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          APP="$RUNNER_TEMP/Turm.xcarchive/Products/Applications/Turm.app"
          FRAMEWORK="$APP/Contents/Frameworks/Sparkle.framework"
          sign() { codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$@"; }
          for xpc in "$FRAMEWORK"/Versions/B/XPCServices/*.xpc; do
            [ -e "$xpc" ] && sign "$xpc"
          done
          sign "$FRAMEWORK/Versions/B/Autoupdate"
          sign "$FRAMEWORK/Versions/B/Updater.app"
          sign "$FRAMEWORK"
          sign --preserve-metadata=entitlements "$APP"

      - name: Verify the signature
        run: |
          APP="$RUNNER_TEMP/Turm.xcarchive/Products/Applications/Turm.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -q 'flags=.*runtime'
          codesign -d --entitlements - --xml "$APP" | grep -q 'keychain-access-groups'
          test -f "$APP/Contents/embedded.provisionprofile"

      - name: Notarise and staple the app
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          APP="$RUNNER_TEMP/Turm.xcarchive/Products/Applications/Turm.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Turm.zip"
          Scripts/notarize.sh "$RUNNER_TEMP/Turm.zip"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Build and sign the disk image
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          DMG: ${{ steps.version.outputs.dmg }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          ditto "$RUNNER_TEMP/Turm.xcarchive/Products/Applications/Turm.app" "$STAGE/Turm.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Turm $VERSION" -srcfolder "$STAGE" -fs HFS+ -format UDZO "$RUNNER_TEMP/$DMG"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$RUNNER_TEMP/$DMG"

      - name: Notarise and staple the disk image
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          Scripts/notarize.sh "$RUNNER_TEMP/$DMG"
          xcrun stapler staple "$RUNNER_TEMP/$DMG"
          xcrun stapler validate "$RUNNER_TEMP/$DMG"

      - name: Verify Gatekeeper acceptance
        env:
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          spctl --assess --type open --context context:primary-signature --verbose=2 "$RUNNER_TEMP/$DMG"
          spctl --assess --type exec --verbose=2 "$RUNNER_TEMP/Turm.xcarchive/Products/Applications/Turm.app"

      - name: Collect the release assets
        env:
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          mkdir -p artifacts
          mv "$RUNNER_TEMP/$DMG" "artifacts/$DMG"
          (cd artifacts && shasum -a 256 "$DMG" > "$DMG.sha256")
          cat "artifacts/$DMG.sha256"

      - name: Download Sparkle tools
        env:
          SPARKLE_VERSION: 2.9.5
          SPARKLE_CHECKSUM: 015336b601493e05c237964954bff6191370003d94edefe663724c88840d73cc
        run: |
          cd "$RUNNER_TEMP"
          curl -sL -o "sparkle-${SPARKLE_VERSION}.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"

          DOWNLOADED_CHECKSUM=$(shasum -a 256 "sparkle-${SPARKLE_VERSION}.tar.xz" | awk '{print $1}')
          if [ "$DOWNLOADED_CHECKSUM" != "$SPARKLE_CHECKSUM" ]; then
            echo "::error::Sparkle checksum mismatch. Expected: $SPARKLE_CHECKSUM, got: $DOWNLOADED_CHECKSUM"
            exit 1
          fi

          tar -xf "sparkle-${SPARKLE_VERSION}.tar.xz"

      # The clone is an `if` condition so a missing gh-pages does not abort the step under bash -e.
      - name: Fetch existing appcast from gh-pages
        id: appcast
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/appcast-work"
          cd "$RUNNER_TEMP/appcast-work"

          if git clone \
            --quiet \
            --single-branch \
            --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          then
            echo "cloned=true" >> "$GITHUB_OUTPUT"
            if [ -f gh-pages/appcast.xml ]; then
              cp gh-pages/appcast.xml existing-appcast.xml
            else
              : > existing-appcast.xml
            fi
          else
            echo "cloned=false" >> "$GITHUB_OUTPUT"
            echo "gh-pages does not exist yet; it will be created on push"
            : > existing-appcast.xml
          fi

      - name: Generate appcast for new release
        env:
          DMG: ${{ steps.version.outputs.dmg }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -o pipefail

          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is empty. Sparkle cannot sign this update, and an unsigned one will not install."
            exit 1
          fi

          APPCAST_GEN_DIR="$RUNNER_TEMP/appcast-new"
          mkdir -p "$APPCAST_GEN_DIR"
          cp "artifacts/$DMG" "$APPCAST_GEN_DIR/"
          cd "$APPCAST_GEN_DIR"

          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--channel beta)
          fi

          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            "${FLAGS[@]}" \
            .

          if [ ! -f appcast.xml ]; then
            echo "::error::generate_appcast wrote no appcast.xml; it names the feed after the basename of SUFeedURL. It produced: $(ls ./*.xml 2>/dev/null || echo 'nothing')."
            exit 1
          fi

      - name: Every enclosure is signed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 Scripts/add-enclosure-signatures.py \
            "$RUNNER_TEMP/bin" \
            "$RUNNER_TEMP/appcast-new/appcast.xml" \
            "$RUNNER_TEMP/appcast-new"

      - name: Merge appcast and sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 Scripts/merge-appcast.py \
            "$RUNNER_TEMP/appcast-work/existing-appcast.xml" \
            "$RUNNER_TEMP/appcast-new/appcast.xml" \
            "$RUNNER_TEMP/appcast-work/appcast-merged.xml"

          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/bin/sign_update" -f - "$RUNNER_TEMP/appcast-work/appcast-merged.xml"

          cp "$RUNNER_TEMP/appcast-work/appcast-merged.xml" "$RUNNER_TEMP/appcast.xml"

      - name: The published feed offers this release
        env:
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          sparkle = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          dmg = os.environ["DMG"]
          tag = os.environ["GITHUB_REF_NAME"]

          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "appcast.xml")).getroot()
          for item in root.findall("channel/item"):
              enclosure = item.find("enclosure")
              if enclosure is None:
                  continue
              url = enclosure.get("url", "")
              if url.rsplit("/", 1)[-1] != dmg:
                  continue
              problems = []
              if f"/download/{tag}/" not in url:
                  problems.append(f"the enclosure URL is not under this tag: {url}")
              if not enclosure.get(f"{{{sparkle}}}edSignature"):
                  problems.append("the enclosure carries no sparkle:edSignature")
              if problems:
                  sys.exit("appcast.xml: " + "; ".join(problems))
              print(f"appcast.xml offers {dmg}, signed, at {url}")
              break
          else:
              sys.exit(f"appcast.xml has no item whose enclosure is {dmg}")
          PY

      - name: Add appcast to release assets
        run: cp "$RUNNER_TEMP/appcast.xml" artifacts/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Turm $VERSION" \
            --generate-notes \
            --verify-tag \
            --prerelease="$PRERELEASE"

      - name: Push appcast to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLONED: ${{ steps.appcast.outputs.cloned }}
        run: |
          cd "$RUNNER_TEMP/appcast-work"

          git config --global user.email "noreply@github.com"
          git config --global user.name "GitHub Actions"

          if [ "$CLONED" != "true" ]; then
            mkdir -p gh-pages
            git init -b gh-pages gh-pages
            git -C gh-pages remote add origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          cp appcast-merged.xml gh-pages/appcast.xml
          cd gh-pages

          git add appcast.xml
          if git rev-parse --verify -q HEAD >/dev/null && git diff --cached --quiet; then
            echo "appcast.xml is unchanged"
          else
            git commit -m "Update appcast for $GITHUB_REF_NAME"
          fi
          git push --set-upstream origin gh-pages

      - name: Remove the signing material
        if: always()
        run: |
          if [ -n "${ORIGINAL_KEYCHAINS:-}" ]; then
            # shellcheck disable=SC2086
            security list-keychains -d user -s $ORIGINAL_KEYCHAINS
          fi
          security delete-keychain "$RUNNER_TEMP/turm-signing.keychain-db" 2>/dev/null || true
          /bin/rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"
          if [ -n "${PROFILE_UUID:-}" ]; then
            /bin/rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.provisionprofile" \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.provisionprofile"
          fi
