name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the brand icons
        run: npm ci --prefix Icons --no-audit --no-fund

      - name: Restore the Swift package checkouts
        id: swiftpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Turm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Test the shared core and the companion protocol
        run: swift test --package-path Packages/TurmCore

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Turm.xcodeproj \
            -scheme Turm \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath "$RUNNER_TEMP/test.xcresult" \
            -only-testing:TurmTests \
            -skip-testing:TurmTests/OutputChunkTests \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # the randomized render test saturates the runner's cores, so it runs alone rather than beside the shell tests
      - name: Test output rendering
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Turm.xcodeproj \
            -scheme Turm \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -resultBundlePath "$RUNNER_TEMP/render.xcresult" \
            -only-testing:TurmTests/OutputChunkTests \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Show test failures
        if: failure()
        run: |
          for bundle in "$RUNNER_TEMP/test.xcresult" "$RUNNER_TEMP/render.xcresult"; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results summary --path "$bundle" | python3 -c 'import json,sys; [print(f["testName"], "|", f["failureText"]) for f in json.load(sys.stdin).get("testFailures", [])]'
          done

      - name: Save the Swift package checkouts
        if: always() && steps.swiftpm.outputs.cache-hit != 'true' && hashFiles('DerivedData/SourcePackages/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}

  ios-build:
    name: iOS build
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the brand icons
        run: npm ci --prefix Icons --no-audit --no-fund

      - name: Restore the Swift package checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Turm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # the phone half of the companion protocol must compile against the same TurmCore the Mac tests ran
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Turm.xcodeproj \
            -scheme TurmiOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  release-build:
    name: Release build
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the brand icons
        run: npm ci --prefix Icons --no-audit --no-fund

      - name: Restore the Swift package checkouts
        id: swiftpm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Turm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Turm.xcodeproj \
            -scheme Turm \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Turm.xcarchive" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Save the Swift package checkouts
        if: always() && steps.swiftpm.outputs.cache-hit != 'true' && hashFiles('DerivedData/SourcePackages/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: ${{ steps.swiftpm.outputs.cache-primary-key }}

      - name: Verify the archived bundle is signed
        run: codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Turm.xcarchive/Products/Applications/Turm.app"
