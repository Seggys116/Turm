name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      NSUnbufferedIO: "YES"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the brand icons
        run: npm ci --prefix Icons --no-audit --no-fund

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Restore the Swift package checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Turm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve packages outside the sandbox
        run: |
          defaults write com.apple.dt.Xcode IDEPackageSupportDisableManifestSandbox -bool YES
          defaults write com.apple.dt.Xcode IDEPackageSupportDisablePluginExecutionSandbox -bool YES
          xcodebuild -resolvePackageDependencies \
            -project Turm.xcodeproj \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -skipPackagePluginValidation

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift
          build-mode: manual

      # the Swift autobuild tracer exits 139 before it compiles anything, so the scan builds the apps itself
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Turm.xcodeproj \
            -scheme Turm \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData/mac \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
          xcodebuild build \
            -project Turm.xcodeproj \
            -scheme TurmiOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData/ios \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:swift"
